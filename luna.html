/* ---------- date helpers (all operate on local-midnight Date objects) ---------- */
const pad = (n) => (n < 10 ? "0" + n : "" + n);
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const addDays = (d, n) => {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
};
const daysBetween = (a, b) => Math.round((b.getTime() - a.getTime()) / 86400000);
const today = () => {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
};
const fmtShort = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtLong = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const MONTH_LABEL = (d) => d.toLocaleDateString(undefined, { month: "long", year: "numeric" });

/* ---------- cycle math ---------- */
function computeCycleData(entries) {
  const flowDates = Object.keys(entries)
    .filter((k) => entries[k].flow)
    .sort();
  const periodStarts = [];
  for (const iso of flowDates) {
    const d = parseISO(iso);
    const prevIso = toISO(addDays(d, -1));
    if (!entries[prevIso] || !entries[prevIso].flow) periodStarts.push(iso);
  }
  const cycleLengths = [];
  for (let i = 1; i < periodStarts.length; i++) {
    cycleLengths.push(daysBetween(parseISO(periodStarts[i - 1]), parseISO(periodStarts[i])));
  }
  const recentLengths = cycleLengths.slice(-6);
  const avgCycleLength = recentLengths.length
    ? Math.round(recentLengths.reduce((a, b) => a + b, 0) / recentLengths.length)
    : 28;

  const lastStartIso = periodStarts[periodStarts.length - 1] || null;
  const lastStart = lastStartIso ? parseISO(lastStartIso) : null;

  // average how many days the actual bleeding streak lasts, from logged flow days
  const periodLengths = periodStarts.map((iso) => {
    let len = 0;
    let cursor = parseISO(iso);
    while (entries[toISO(cursor)]?.flow) {
      len++;
      cursor = addDays(cursor, 1);
    }
    return len;
  });
  const recentPeriodLengths = periodLengths.filter((n) => n > 0).slice(-6);
  const avgPeriodLength = recentPeriodLengths.length
    ? Math.round(recentPeriodLengths.reduce((a, b) => a + b, 0) / recentPeriodLengths.length)
    : 5;

  let predictedNextPeriod = null,
    predictedPeriodEnd = null,
    predictedOvulation = null,
    fertileStart = null,
    fertileEnd = null,
    currentCycleDay = null,
    fertileStartDay = null,
    fertileEndDay = null;

  if (lastStart) {
    predictedNextPeriod = addDays(lastStart, avgCycleLength);
    predictedPeriodEnd = addDays(predictedNextPeriod, avgPeriodLength - 1);
    predictedOvulation = addDays(predictedNextPeriod, -14);
    fertileStart = addDays(predictedOvulation, -5);
    fertileEnd = addDays(predictedOvulation, 1);
    currentCycleDay = daysBetween(lastStart, today()) + 1;
    fertileStartDay = daysBetween(lastStart, fertileStart) + 1;
    fertileEndDay = daysBetween(lastStart, fertileEnd) + 1;
  }

  // fertility signs observed in the current (ongoing) cycle
  let peakDayIso = null;
  if (lastStart) {
    const cursor = new Date(lastStart);
    while (cursor <= today()) {
      const iso = toISO(cursor);
      const fluid = entries[iso]?.fluid;
      if (fluid === "eggwhite" || fluid === "watery") peakDayIso = iso;
      cursor.setDate(cursor.getDate() + 1);
    }
  }

  // is today still within the initial bleed streak?
  let inPeriodNow = false;
  if (lastStart) {
    const cursor = new Date(lastStart);
    while (cursor <= today()) {
      const iso = toISO(cursor);
      if (!entries[iso]?.flow) break;
      if (toISO(cursor) === toISO(today())) inPeriodNow = true;
      cursor.setDate(cursor.getDate() + 1);
    }
  }

  let phase = "No data yet";
  if (lastStart) {
    if (inPeriodNow) phase = "Period";
    else if (currentCycleDay < fertileStartDay) phase = "Follicular phase";
    else if (currentCycleDay <= fertileEndDay) phase = "Fertile window";
    else phase = "Luteal phase";
  }

  // the single day treated as "most fertile" for the current cycle: an observed
  // egg-white/watery day takes priority over the calendar-based prediction
  const mostFertileIso = peakDayIso || (predictedOvulation ? toISO(predictedOvulation) : null);

  return {
    periodStarts,
    cycleLengths,
    avgCycleLength,
    avgPeriodLength,
    lastStart,
    predictedNextPeriod,
    predictedPeriodEnd,
    predictedOvulation,
    fertileStart,
    fertileEnd,
    fertileStartDay,
    fertileEndDay,
    currentCycleDay,
    peakDayIso,
    mostFertileIso,
    phase,
    hasEnoughForPrediction: cycleLengths.length >= 1,
  };
}

/* given a date, find which logged cycle it falls in and which day number that is */
function cycleDayLabel(iso, periodStarts) {
  const d = parseISO(iso);
  let startIso = null;
  for (let i = periodStarts.length - 1; i >= 0; i--) {
    if (parseISO(periodStarts[i]) <= d) {
      startIso = periodStarts[i];
      break;
    }
  }
  if (!startIso) return null;
  const dayNum = daysBetween(parseISO(startIso), d) + 1;
  const isCurrent = startIso === periodStarts[periodStarts.length - 1];
  return { dayNum, isCurrent };
}

/* ---------- calendar view ---------- */
function CalendarView({ entries, onChange, cycleData }) {
  const [monthCursor, setMonthCursor] = useState(() => {
    const d = today();
    return new Date(d.getFullYear(), d.getMonth(), 1);
  });
  const [selected, setSelected] = useState(null);

  const firstOfMonth = monthCursor;
  const startWeekday = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(firstOfMonth.getFullYear(), firstOfMonth.getMonth() + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(firstOfMonth.getFullYear(), firstOfMonth.getMonth(), d));

  const { fertileStart, fertileEnd, predictedNextPeriod, predictedPeriodEnd, mostFertileIso } = cycleData;
  const isToday = (d) => toISO(d) === toISO(today());

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button
          style={iconBtnStyle}
          onClick={() => setMonthCursor(new Date(monthCursor.getFullYear(), monthCursor.getMonth() - 1, 1))}
          aria-label="Previous month"
        >
          <ChevronLeft size={19} color={COLORS.text} />
        </button>
        <div style={{ fontFamily: "var(--serif)", fontSize: 19, color: COLORS.text }}>{MONTH_LABEL(monthCursor)}</div>
        <button
          style={iconBtnStyle}
          onClick={() => setMonthCursor(new Date(monthCursor.getFullYear(), monthCursor.getMonth() + 1, 1))}
          aria-label="Next month"
        >
          <ChevronRight size={19} color={COLORS.text} />
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 4 }}>
        {["M", "T", "W", "T", "F", "S", "S"].map((d, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 12, color: COLORS.textMuted, padding: "4px 0" }}>
            {d}
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const iso = toISO(d);
          const entry = entries[iso];
          const pastOrToday = d <= today();
          const loggedPeriod = !!entry?.flow;
          const predictedPeriod =
            !loggedPeriod && predictedNextPeriod && predictedPeriodEnd && d >= predictedNextPeriod && d <= predictedPeriodEnd;
          const mostFertile = mostFertileIso && iso === mostFertileIso;
          const inWindow = fertileStart && fertileEnd && d >= fertileStart && d <= fertileEnd;

          let bg = "transparent";
          let textColor = COLORS.text;
          if (loggedPeriod) {
            bg = COLORS.periodStrong;
            textColor = "#fff";

            bg = COLORS.periodPale;
          } else if (mostFertile) {
            bg = pastOrToday ? COLORS.fertileStrong : COLORS.fertilePale;
            textColor = pastOrToday ? "#fff" : COLORS.text;
          } else if (inWindow) {
            bg = pastOrToday ? COLORS.fertileWindow : COLORS.fertileWindowPale;

            <button
              key={i}

              style={{
                aspectRatio: "1",

                border: isToday(d)

/* ---------- chart view ---------- */
function ChartView({ entries, cycleData }) {
  const { periodStarts, cycleLengths, avgCycleLength } = cycleData;
  const rows = useMemo(() => {
    const list = [];
    const starts = periodStarts;
    for (let i = 0; i < starts.length; i++) {
      const start = parseISO(starts[i]);
      const end = i < starts.length - 1 ? addDays(parseISO(starts[i + 1]), -1) : today();
      const length = daysBetween(start, i < starts.length - 1 ? parseISO(starts[i + 1]) : today()) + (i < starts.length - 1 ? 0 : 1);
      list.push({ start, end, length, ongoing: i === starts.length - 1 });
    }
    return list.reverse().slice(0, 6);
  }, [periodStarts]);

  const maxDay = Math.max(28, ...rows.map((r) => r.length), avgCycleLength);

  if (rows.length === 0) {
    return (
      <div style={{ padding: "40px 10px", textAlign: "center", color: COLORS.textMuted }}>
        Nothing charted yet. Log a period start date and this will fill in.
      </div>
    );
  }

  return (
    <div>
      <div style={{ overflowX: "auto", paddingBottom: 6 }}>
        <div style={{ minWidth: maxDay * 15 + 90 }}>
          {rows.map((row, ri) => (
            <div key={ri} style={{ display: "flex", alignItems: "center", marginBottom: 10 }}>
              <div style={{ width: 90, flexShrink: 0, fontSize: 12, color: COLORS.textMuted, fontFamily: "var(--sans)" }}>
                {fmtShort(row.start)}
                {row.ongoing ? " – now" : ` (${row.length}d)`}
              </div>
              <div style={{ display: "flex", gap: 2 }}>
                {Array.from({ length: maxDay }).map((_, di) => {
                  const d = addDays(row.start, di);
                  if (d > row.end) return <div key={di} style={{ width: 13, height: 22 }} />;
                  const iso = toISO(d);
                  const entry = entries[iso];
                  const isPeakOfThisRow = (() => {
                    let peak = null;
                    let cursor = row.start;
                    while (cursor <= row.end) {
                      const f = entries[toISO(cursor)]?.fluid;
                      if (f === "eggwhite" || f === "watery") peak = toISO(cursor);
                      cursor = addDays(cursor, 1);
                    }
                    return peak === iso;
                  })();
                  return (
                    <div
                      key={di}
                      title={fmtShort(d)}
                      style={{
                        width: 13,
                        height: 22,
                        borderRadius: 4,
                        background: entry?.fluid
                          ? entry.fluid === "eggwhite" || entry.fluid === "watery"
                            ? COLORS.mossSoft
                            : COLORS.surfaceMuted
                          : "transparent",
                        border: isPeakOfThisRow ? `1.3px solid ${COLORS.amber}` : "1px solid transparent",
                        display: "flex",
                        alignItems: "flex-end",
                        justifyContent: "center",
                        paddingBottom: 2,
                      }}
                    >
                      {entry?.flow && <FlowDot level={entry.flow} size={8} />}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 8, fontSize: 12.5, color: COLORS.textMuted }}>
        Each square is a day of the cycle. Wine dots mark flow, pale-green squares mark eggwhite/watery mucus, the amber
        outline marks the most fertile-type mucus seen that cycle.
      </div>

      {cycleLengths.length > 0 && (
        <div style={{ marginTop: 30 }}>
          <div style={{ fontFamily: "var(--serif)", fontSize: 16, color: COLORS.text, marginBottom: 12 }}>Cycle length over time</div>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 100 }}>
            {cycleLengths.slice(-8).map((len, i) => {
              const h = Math.max(8, (len / (maxDay + 4)) * 100);
              return (
                <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                  <div style={{ fontSize: 11, color: COLORS.textMuted }}>{len}</div>
                  <div style={{ width: 20, height: `${h}px`, background: COLORS.wineSoft, borderRadius: 4, border: `1px solid ${COLORS.wine}` }} />
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 8 }}>
            Average of the last {Math.min(6, cycleLengths.length)} cycle{cycleLengths.length > 1 ? "s" : ""}: {avgCycleLength} days
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- history view ---------- */
function HistoryView({ cycleData }) {
  const { periodStarts } = cycleData;

  if (periodStarts.length === 0) {
    return (
      <div style={{ padding: "40px 10px", textAlign: "center", color: COLORS.textMuted }}>
        No cycles logged yet. Once you've marked a couple of period start dates, they'll show up here.
      </div>
    );
  }

  const rows = periodStarts
    .map((startIso, i) => {
      const start = parseISO(startIso);
      const isLast = i === periodStarts.length - 1;
      if (isLast) {
        const length = daysBetween(start, today()) + 1;
        return { start, finish: null, length, ongoing: true };
      }
      const nextStart = parseISO(periodStarts[i + 1]);
      const finish = addDays(nextStart, -1);
      const length = daysBetween(start, nextStart);
      return { start, finish, length, ongoing: false };
    })
    .reverse();

  return (
    <div>
      <div style={{ display: "flex", fontSize: 12, color: COLORS.textMuted, padding: "0 4px 8px", borderBottom: `1px solid ${COLORS.border}` }}>
        <div style={{ flex: "0 0 26px" }}>#</div>
        <div style={{ flex: "1 1 40%" }}>Start</div>
        <div style={{ flex: "1 1 40%" }}>Finish</div>
        <div style={{ flex: "0 0 70px", textAlign: "right" }}>Length</div>
      </div>
      {rows.map((row, i) => (
        <div
          key={i}
          style={{
            display: "flex",
            alignItems: "center",
            padding: "12px 4px",
            borderBottom: `1px solid ${COLORS.border}`,
            fontSize: 14,
          }}
        >
          <div style={{ flex: "0 0 26px", color: COLORS.textMuted }}>{rows.length - i}</div>
          <div style={{ flex: "1 1 40%", color: COLORS.text }}>{fmtShort(row.start)}</div>
          <div style={{ flex: "1 1 40%", color: row.ongoing ? COLORS.textMuted : COLORS.text }}>
            {row.ongoing ? "Ongoing" : fmtShort(row.finish)}
          </div>
          <div style={{ flex: "0 0 70px", textAlign: "right", color: COLORS.text }}>
            {row.length} day{row.length === 1 ? "" : "s"}
          </div>
        </div>
      ))}
    </div>
  );
}

function buildDemoCycle(startDate, fillThroughOffset) {

function generateDemoEntries() {

/* ---------- CSV import (Kindara export) ----------
   Kindara's real export (confirmed against an actual file) uses one column
   per fluid type (e.g. "fluid dry", "fluid eggwhite", each "-" or an
   intensity) plus a "menstruation" column (-, light, medium, heavy) and a
   separate "spotting" column. parseNativeKindaraRow reads that directly.
   For any CSV that doesn't match this shape, the app falls back to
   guessing a single date/flow/mucus column and asking the person to
   confirm the mapping. */
const KINDARA_FLUID_COLUMNS = ["fluid eggwhite", "fluid watery", "fluid creamy", "fluid sticky", "fluid dry"];
const KINDARA_FLUID_MAP = {
  "fluid dry": "dry",
  "fluid sticky": "sticky",
  "fluid creamy": "creamy",
  "fluid eggwhite": "eggwhite",
  "fluid watery": "watery",
};
function looksLikeNativeKindaraExport(headers) {
  const set = new Set(headers.map((h) => h.toLowerCase()));
  return set.has("date") && set.has("menstruation") && KINDARA_FLUID_COLUMNS.some((c) => set.has(c));
}
function parseNativeKindaraRow(row) {
  let flow = null;
  const menstruation = (row["menstruation"] || "").trim().toLowerCase();
  if (menstruation === "light" || menstruation === "medium" || menstruation === "heavy") {
    flow = menstruation;
  } else if ((row["spotting"] || "").trim().toLowerCase() === "true") {
    flow = "spotting";
  }
  // most-fertile-first: if more than one fluid column was marked that day, keep the most fertile
  let fluid = null;
  for (const col of KINDARA_FLUID_COLUMNS) {
    if (row[col] && row[col].trim() !== "-" && row[col].trim() !== "") {
      fluid = KINDARA_FLUID_MAP[col];
      break;
    }
  }
  return { flow, fluid };
}

function guessColumn(headers, keywords) {
  const lower = headers.map((h) => h.toLowerCase());
  for (const kw of keywords) {
    const idx = lower.findIndex((h) => h.includes(kw));
    if (idx !== -1) return headers[idx];
  }
  return "";
}
function parseFlexibleDate(raw) {
  if (!raw) return null;
  const trimmed = String(raw).trim();
  if (!trimmed) return null;
  let d = new Date(trimmed);
  if (!isNaN(d.getTime())) {
    d.setHours(0, 0, 0, 0);
    return d;
  }
  const m = trimmed.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
  if (m) {
    let [, a, b, yr] = m;
    if (yr.length === 2) yr = "20" + yr;
    d = new Date(Number(yr), Number(a) - 1, Number(b));
    if (!isNaN(d.getTime())) return d;
  }
  return null;
}
function parseFlowValue(raw) {
  if (!raw) return null;
  const v = String(raw).trim().toLowerCase();
  if (!v || v === "0" || v === "none") return null;
  if (v.includes("heavy") || v === "h") return "heavy";
  if (v.includes("med") || v === "m") return "medium";
  if (v.includes("light") || v === "l" || v === "lt") return "light";
  if (v.includes("spot") || v === "s") return "spotting";
  return null;
}
function parseFluidValue(raw) {
  if (!raw) return null;
  const v = String(raw).trim().toLowerCase();
  if (!v || v === "0" || v === "none") return null;
  if (v.includes("dry")) return "dry";
  if (v.includes("sticky") || v.includes("tacky")) return "sticky";
  if (v.includes("cream") || v.includes("lotion")) return "creamy";
  if (v.includes("egg") || v === "ew") return "eggwhite";
  if (v.includes("water")) return "watery";
  return null;
}

  const [authPassword, setAuthPassword] = useState("");
  const [authError, setAuthError] = useState(null);
  const [authLoading, setAuthLoading] = useState(false);

  const [entries, setEntries] = useState({});
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("calendar");
  const [error, setError] = useState(null);
  const [importPreview, setImportPreview] = useState(null);
  const [importMessage, setImportMessage] = useState(null);
  const fileInputRef = useRef(null);

  // auth session — check once on load, then stay in sync with login/logout
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  // load her entries from Supabase whenever she's signed in
  useEffect(() => {
    if (!session) {
      setEntries({});
      setLoading(false);
      return;
    }
    setLoading(true);
    sb.from("cycle_entries")
      .select("date,flow,fluid")
      .eq("user_id", session.user.id)
      .then(({ data, error }) => {
        if (error) {
          setError("Couldn't load your data — try refreshing.");
          setLoading(false);
          return;
        }
        const map = {};
        (data || []).forEach((row) => {
          const e = {};
          if (row.flow) e.flow = row.flow;
          if (row.fluid) e.fluid = row.fluid;
          if (Object.keys(e).length) map[row.date] = e;
        });
        setEntries(map);
        setLoading(false);
      });
  }, [session]);

  // writes the difference between prev and next to Supabase: upserts changed/added
  // days, deletes any day that existed in prev but is gone from next
  const persist = useCallback(
    async (next, prev) => {
      if (!session) return;
      try {
        const userId = session.user.id;
        const prevKeys = Object.keys(prev || {});
        const nextKeys = new Set(Object.keys(next));
        const toDelete = prevKeys.filter((k) => !nextKeys.has(k));
        const toUpsert = Object.entries(next).map(([date, e]) => ({
          user_id: userId,
          date,
          flow: e.flow || null,
          fluid: e.fluid || null,
          updated_at: new Date().toISOString(),
        }));
        if (toDelete.length) {
          const { error: delErr } = await sb.from("cycle_entries").delete().eq("user_id", userId).in("date", toDelete);
          if (delErr) throw delErr;
        }
        for (let i = 0; i < toUpsert.length; i += 500) {
          const chunk = toUpsert.slice(i, i + 500);
          const { error: upErr } = await sb.from("cycle_entries").upsert(chunk, { onConflict: "user_id,date" });
          if (upErr) throw upErr;
        }
        setError(null);
      } catch (e) {
        setError("Couldn't save just now — your last change may not have stuck.");
      }
    },
    [session]
  );

  const handleLogin = async (e) => {
    e.preventDefault();
    setAuthLoading(true);
    setAuthError(null);
    const { error } = await sb.auth.signInWithPassword({ email: authEmail, password: authPassword });
    setAuthLoading(false);
    if (error) setAuthError(error.message);
  };
  const handleSignup = async (e) => {
    e.preventDefault();
    setAuthLoading(true);
    setAuthError(null);
    const { error } = await sb.auth.signUp({ email: authEmail, password: authPassword });
    setAuthLoading(false);
    if (error) setAuthError(error.message);
  };
  const handleSignOut = () => sb.auth.signOut();

  const handleChange = useCallback(
    (iso, patch) => {
      setEntries((prev) => {
        const cleaned = { ...patch };
        if (!cleaned.flow) delete cleaned.flow;
        if (!cleaned.fluid) delete cleaned.fluid;
        const next = { ...prev };
        if (Object.keys(cleaned).length === 0) delete next[iso];
        else next[iso] = cleaned;
        persist(next, prev);
        return next;
      });
    },
    [persist]
  );

  const cycleData = useMemo(() => computeCycleData(entries), [entries]);

  // TEMPORARY: demo controls — safe to remove along with the buttons below
  const handleLoadDemo = () => {
    const demo = generateDemoEntries();
    persist(demo, entries);
    setEntries(demo);
  };
  const handleClearAll = () => {
    if (!window.confirm("Clear all logged days? This can't be undone.")) return;
    persist({}, entries);
    setEntries({});
  };

  const mergeImportedRows = (existing, rows, dateCol, getFlowFluid) => {
    let imported = 0,
      flowCount = 0,
      fluidCount = 0,
      skipped = 0;
    const next = { ...existing };
    rows.forEach((row) => {
      const d = parseFlexibleDate(row[dateCol]);
      if (!d) {
        skipped++;
        return;
      }
      const iso = toISO(d);
      const { flow, fluid } = getFlowFluid(row);
      const patch = { ...(next[iso] || {}) };
      if (flow) {
        patch.flow = flow;
        flowCount++;
      }
      if (fluid) {
        patch.fluid = fluid;
        fluidCount++;
      }
      if (patch.flow || patch.fluid) {
        next[iso] = patch;
        imported++;
      }
    });
    return { next, imported, flowCount, fluidCount, skipped };
  };

  const summarizeImport = ({ imported, flowCount, fluidCount, skipped }) =>
    `Imported ${imported} day${imported === 1 ? "" : "s"} (${flowCount} with flow, ${fluidCount} with mucus data)` +
    (skipped ? `, skipped ${skipped} row${skipped === 1 ? "" : "s"} with an unrecognized date.` : ".");

  const handleFileSelected = (e) => {
    const file = e.target.files?.[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = Papa.parse(String(reader.result), { header: true, skipEmptyLines: true });
      const headers = parsed.meta?.fields || [];
      if (headers.length === 0 || parsed.data.length === 0) {
        setImportMessage("Couldn't find any rows in that file — check it's the CSV export from Kindara.");
        return;
      }
      if (looksLikeNativeKindaraExport(headers)) {
        // matches Kindara's real export shape — safe to import directly, no manual mapping needed
        const result = mergeImportedRows(entries, parsed.data, "date", parseNativeKindaraRow);
        persist(result.next, entries);
        setEntries(result.next);
        setImportPreview(null);
        setImportMessage(summarizeImport(result));
        return;
      }
      // unrecognized shape — fall back to guessing a single date/flow/mucus column
      setImportMessage(null);
      setImportPreview({
        headers,
        rows: parsed.data,
        dateCol: guessColumn(headers, ["date"]),
        flowCol: guessColumn(headers, ["flow", "bleed", "period", "menstrual"]),
        fluidCol: guessColumn(headers, ["mucus", "fluid", "discharge", "cervical", "cm"]),
      });
    };
    reader.readAsText(file);
  };

  const handleConfirmImport = () => {
    if (!importPreview) return;
    const { rows, dateCol, flowCol, fluidCol } = importPreview;
    const result = mergeImportedRows(entries, rows, dateCol, (row) => ({
      flow: flowCol ? parseFlowValue(row[flowCol]) : null,
      fluid: fluidCol ? parseFluidValue(row[fluidCol]) : null,
    }));
    persist(result.next, entries);
    setEntries(result.next);
    setImportPreview(null);
    setImportMessage(summarizeImport(result));
  };

  if (session === undefined) {
    return (
      <div
        style={{
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: COLORS.bg,
          color: COLORS.textMuted,
          fontFamily: "var(--sans)",
        }}
      >
        <style>{`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');`}</style>
        Loading…
      </div>
    );
  }

  if (!session) {
    return (
      <div
        style={{
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: COLORS.bg,
          padding: 20,
        }}
      >
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
          @font-face {
            font-family: 'Fontdiner Swanky';
            src: url(data:font/woff2;base64,${FONTDINER_SWANKY_WOFF2}) format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
          }
          * { box-sizing: border-box; }
        `}</style>
        <form
          onSubmit={authMode === "login" ? handleLogin : handleSignup}
          style={{ ...cardStyle, width: "100%", maxWidth: 340, fontFamily: "var(--sans)" }}
        >
          <div
            style={{
              fontFamily: "'Fontdiner Swanky', cursive",
              fontSize: 36,
              color: "#4B2E5A",
              marginBottom: 18,
              textAlign: "center",
            }}
          >
            Luna
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <input
              type="email"
              required
              placeholder="Email"
              value={authEmail}
              onChange={(e) => setAuthEmail(e.target.value)}
              style={selectStyle}
            />
            <input
              type="password"
              required
              minLength={6}
              placeholder="Password"
              value={authPassword}
              onChange={(e) => setAuthPassword(e.target.value)}
              style={selectStyle}
            />
          </div>
          {authError && <div style={{ color: COLORS.periodStrong, fontSize: 12.5, marginTop: 10 }}>{authError}</div>}
          <button
            type="submit"
            disabled={authLoading}
            style={{ ...pillStyle(true), width: "100%", justifyContent: "center", marginTop: 16, opacity: authLoading ? 0.6 : 1 }}
          >
            {authLoading ? "Please wait…" : authMode === "login" ? "Log in" : "Create account"}
          </button>
          <button
            type="button"
            onClick={() => {
              setAuthMode((m) => (m === "login" ? "signup" : "login"));
              setAuthError(null);
            }}
            style={{ ...demoLinkStyle, display: "block", margin: "14px auto 0" }}
          >
            {authMode === "login" ? "New here? Create an account" : "Already have an account? Log in"}
          </button>
        </form>
      </div>
    );
  }

  return (
    <div
      style={{
        "--serif": "'Fraunces', ui-serif, Georgia, serif",
        "--sans": "'Inter', ui-sans-serif, system-ui, sans-serif",
        background: COLORS.bg,
        minHeight: "100%",
        fontFamily: "var(--sans)",
        color: COLORS.text,
        padding: "28px 20px 60px",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap');
        @font-face {
          font-family: 'Fontdiner Swanky';
          src: url(data:font/woff2;base64,${FONTDINER_SWANKY_WOFF2}) format('woff2');
          font-weight: 400;
          font-style: normal;
          font-display: swap;
        }
        * { box-sizing: border-box; }
        button { font-family: inherit; }
        button:focus-visible { outline: 2px solid ${COLORS.wine}; outline-offset: 2px; }
      `}</style>

      <div style={{ maxWidth: 620, margin: "0 auto" }}>
        <div style={{ marginBottom: 22 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <span style={{ fontFamily: "'Fontdiner Swanky', cursive", fontSize: 40, lineHeight: 1, color: "#4B2E5A" }}>
              Luna
            </span>
            <button onClick={handleSignOut} style={{ ...demoLinkStyle, marginTop: 8 }}>
              Sign out
            </button>
          </div>
          <div style={{ fontSize: 13.5, color: COLORS.textMuted, marginTop: 2 }}>
            Signed in as {session.user.email} — your own record of flow and fertility signs.
          </div>
          {/* TEMPORARY: remove this row once real tracking has started */}
          <div style={{ display: "flex", gap: 14, marginTop: 10, flexWrap: "wrap" }}>
            <button onClick={handleLoadDemo} style={demoLinkStyle}>
              Load example months
            </button>
            <button onClick={handleClearAll} style={demoLinkStyle}>
              Clear all data
            </button>
          </div>

          <div style={{ marginTop: 12 }}>
            <button onClick={() => fileInputRef.current?.click()} style={pillStyle(false)}>
              Import from Kindara (CSV)
            </button>
            <input
              ref={fileInputRef}
              type="file"
              accept=".csv,text/csv"
              onChange={handleFileSelected}
              style={{ display: "none" }}
            />
          </div>

          {importMessage && !importPreview && (
            <div style={{ marginTop: 10, fontSize: 12.5, color: COLORS.textMuted }}>{importMessage}</div>
          )}

          {importPreview && (
            <div style={{ ...cardStyle, marginTop: 14 }}>
              <div style={{ fontFamily: "var(--serif)", fontSize: 16, color: COLORS.text, marginBottom: 8 }}>
                Check the column mapping
              </div>
              <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginBottom: 16 }}>
                Found {importPreview.rows.length} rows. I've guessed which columns hold what — Kindara's exact export
                format isn't something I can verify, so worth a quick check before importing.
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div>
                  <div style={labelStyle}>Date column</div>
                  <select
                    value={importPreview.dateCol}
                    onChange={(e) => setImportPreview((p) => ({ ...p, dateCol: e.target.value }))}
                    style={selectStyle}
                  >
                    <option value="">— choose —</option>
                    {importPreview.headers.map((h) => (
                      <option key={h} value={h}>
                        {h}
                      </option>
                    ))}
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>Flow / bleeding column</div>
                  <select
                    value={importPreview.flowCol}
                    onChange={(e) => setImportPreview((p) => ({ ...p, flowCol: e.target.value }))}
                    style={selectStyle}
                  >
                    <option value="">None</option>
                    {importPreview.headers.map((h) => (
                      <option key={h} value={h}>
                        {h}
                      </option>
                    ))}
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>Mucus / fluid column</div>
                  <select
                    value={importPreview.fluidCol}
                    onChange={(e) => setImportPreview((p) => ({ ...p, fluidCol: e.target.value }))}
                    style={selectStyle}
                  >
                    <option value="">None</option>
                    {importPreview.headers.map((h) => (
                      <option key={h} value={h}>
                        {h}
                      </option>
                    ))}
                  </select>
                </div>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
                <button
                  onClick={handleConfirmImport}
                  disabled={!importPreview.dateCol}
                  style={{ ...pillStyle(true), opacity: importPreview.dateCol ? 1 : 0.5 }}
                >
                  Import
                </button>
                <button onClick={() => setImportPreview(null)} style={pillStyle(false)}>
                  Cancel
                </button>
              </div>
            </div>
          )}
        </div>

        {loading ? (
          <div style={{ color: COLORS.textMuted, fontSize: 14 }}>Loading…</div>
        ) : (
          <>
            <SummaryCard cycleData={cycleData} />

            {error && (
              <div style={{ marginTop: 10, fontSize: 12.5, color: COLORS.wine }}>{error}</div>
            )}

            <div style={{ display: "flex", gap: 22, marginTop: 26, marginBottom: 18, borderBottom: `1px solid ${COLORS.border}` }}>
              {["calendar", "chart", "history"].map((v) => (
                <button
                  key={v}
                  onClick={() => setView(v)}
                  style={{
                    background: "none",
                    border: "none",
                    padding: "0 0 10px 0",
                    fontSize: 14.5,
                    cursor: "pointer",
                    color: view === v ? COLORS.text : COLORS.textMuted,
                    borderBottom: view === v ? `2px solid ${COLORS.wine}` : "2px solid transparent",
                    marginBottom: -1,
                    textTransform: "capitalize",
                  }}
                >
                  {v}
                </button>
              ))}
            </div>

            {view === "calendar" && <CalendarView entries={entries} onChange={handleChange} cycleData={cycleData} />}
            {view === "chart" && <ChartView entries={entries} cycleData={cycleData} />}
            {view === "history" && <HistoryView cycleData={cycleData} />}
          </>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
